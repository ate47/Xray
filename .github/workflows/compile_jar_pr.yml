name: Pull request Compile test 🏗️

on:
  pull_request:
    paths:
      - "src/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🪛 Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: 🏗️ Build jars
        run: |
          chmod u+x gradlew
          ./gradlew build
